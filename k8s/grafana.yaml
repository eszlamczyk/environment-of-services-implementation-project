# --- ConfigMap: provisioning datasource Prometheus ---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        orgId: 1
        type: prometheus
        access: proxy
        url: http://prometheus.default.svc.cluster.local:9090
        isDefault: true
        editable: true
---
# --- ConfigMap: provisioning dashboardów ---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: argocd
        folder: 'ArgoCD'
        type: file
        options:
          path: /etc/grafana/dashboards/argocd
      - name: kubernetes
        folder: 'Kubernetes'
        type: file
        options:
          path: /etc/grafana/dashboards/kubernetes
      - name: app
        folder: 'Application'
        type: file
        options:
          path: /etc/grafana/dashboards/app
---
# --- Deployment Grafany ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:13.0.1  # <-- Sprawdź tę wersję (obecnie stabilne to ~11.x)
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: "admin"
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "admin"
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: "Viewer"
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards-argocd
              mountPath: /etc/grafana/dashboards/argocd
            - name: dashboards-kubernetes
              mountPath: /etc/grafana/dashboards/kubernetes
            - name: dashboards-app
              mountPath: /etc/grafana/dashboards/app
            - name: storage
              mountPath: /var/lib/grafana
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboards-argocd
          configMap:
            name: grafana-dashboard-argocd
        - name: dashboards-kubernetes
          configMap:
            name: grafana-dashboard-kubernetes
        - name: dashboards-app
          configMap:
            name: grafana-dashboard-app
        - name: storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30300